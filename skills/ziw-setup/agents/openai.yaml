interface:
  display_name: "Setup"
  short_description: "Create or refresh config"
  default_prompt: "Use $ziw-setup to create or refresh repo workflow config, reading existing config first. On a scoped refresh verify changed or suspect fields and their dependencies; initial setup or explicit full verification covers every applicable field. Preserve unrelated stable mappings and report verification scope and remaining gaps. Include planning authority and documentation checks."
policy:
  allow_implicit_invocation: true
