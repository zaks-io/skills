interface:
  display_name: "Create PR"
  short_description: "Create pull requests"
  default_prompt: "Use $ziw-pr to commit, push, and open or update a non-draft ready-for-review PR for my current branch in one pass, then hand it off for independent review. Run no checks of your own: trust the caller's report, hooks, and CI, and do not wait for CI. Author QA is the implementer's judgment-based call; do not run it here unless I ask, and a new commit alone never calls for it. Author QA is not independent review evidence. Do not apply or clear review-evidence labels, move the issue to `Ready to Merge`, or apply merge-ready PR labels."
policy:
  allow_implicit_invocation: true
