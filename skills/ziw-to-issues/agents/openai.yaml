interface:
  display_name: "To Issues"
  short_description: "Spec or PRD into ready slices"
  default_prompt: "Use $ziw-to-issues to break this spec, PRD, or epic ticket into the fewest dependency-ordered one-PR implementation tickets that ship safely, each a whole outcome with its tests and docs and explicit in-scope and out-of-scope boundaries. Merge layer, step, test-only, docs-only, and trivially small tickets into the outcome they belong to, ticket only work the plan requires, adopt any existing tickets, apply the agent-ready body contract, configured estimates, and kind labels, and emit the dependency graph and file footprint. Do not emit implementation slices or readiness for planning artifacts explicitly marked Draft; when explicitly asked, preserve the Draft as a non-ready kind-spec or kind-epic container. Return material ambiguities to $ziw-grill."
policy:
  allow_implicit_invocation: true
